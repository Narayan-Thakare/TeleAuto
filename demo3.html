<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telegram Message Sender</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(135deg,#2193b0,#6dd5ed);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.container{
    width:700px;
    background:#fff;
    border-radius:18px;
    padding:30px;
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0088cc;
    margin-bottom:25px;
}

textarea{
    width:100%;
    height:140px;
    resize:none;
    padding:15px;
    border-radius:10px;
    border:2px solid #ddd;
    font-size:15px;
    transition:.3s;
}

textarea:focus{
    border-color:#0088cc;
    outline:none;
}

.file-box{
    margin-top:20px;
}

input[type=file]{
    width:100%;
    padding:10px;
    border:2px dashed #0088cc;
    border-radius:10px;
    background:#f7fbff;
    cursor:pointer;
}

.group-box{
    margin-top:25px;
    border:1px solid #ddd;
    border-radius:10px;
    padding:15px;
    max-height:250px;
    overflow:auto;
}

.group-box h3{
    color:#444;
    margin-bottom:15px;
}

.group-item{
    display:flex;
    align-items:center;
    padding:10px;
    border-radius:8px;
    transition:.3s;
}

.group-item:hover{
    background:#eef8ff;
}

.group-item input{
    margin-right:12px;
    transform:scale(1.2);
}

.select-all{
    background:#0088cc;
    color:white;
    padding:10px;
    border-radius:8px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
}

.select-all input{
    margin-right:10px;
    transform:scale(1.2);
}

button{
    width:100%;
    margin-top:25px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#0088cc;
    color:white;
    font-size:18px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#006fa5;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,136,204,.4);
}

.footer{
    text-align:center;
    margin-top:15px;
    color:#888;
    font-size:13px;
}

</style>

</head>
<body>

<div class="container">

<h2>📨 Telegram Message Sender</h2>

<textarea
id="message"
placeholder="Type your message here..."></textarea>

<div class="file-box">

<label><b>📎 Attach File (Optional)</b></label>

<br><br>

<input type="file"
id="file"
accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">

</div>

<div class="group-box">

<h3>👥 Select Groups</h3>

<div class="select-all">
<input type="checkbox" id="selectAll" onchange="toggleAll()">
<label>Select All Groups</label>
</div>

<div class="group-item">
<input type="checkbox" class="group" value="-5551738015">
<label>🚀 Demo Group</label>
</div>

<div class="group-item">
<input type="checkbox" class="group" value="-5468420834">
<label>💻 Demo Group 2</label>
</div>

<div class="group-item">
<input type="checkbox" class="group" value="-5489433287">
<label>📚 Demo Group 3</label>
</div>

</div>

<button onclick="sendMessage()">
🚀 Send Message
</button>

<div class="footer">
Made with ❤️ for Telegram Automation
</div>

</div>

</body>
</html>
