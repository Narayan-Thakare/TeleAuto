<!DOCTYPE html>
<html>
<head>
    <title>Telegram Sender</title>
</head>
<body>

<h2>Telegram Message Sender</h2>

<textarea id="message" rows="5" cols="40"
          placeholder="Enter your message"></textarea>

<br><br>

<label>Select File (Optional):</label><br>
<input type="file" id="file"
accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">

<br><br>

<h3>Select Groups</h3>

<label>
    <input type="checkbox" id="selectAll" onchange="toggleAll()">
    Select All
</label>

<hr>

<label>
    <input type="checkbox" class="group" value="-5551738015">
    Demo Group
</label>
<br>

<label>
    <input type="checkbox" class="group" value="-5468420834">
    Demo Group 2
</label>
<br>

<label>
    <input type="checkbox" class="group" value="-5489433287">
    Demo Group 3
</label>


<br><br>

<button onclick="sendMessage()">Send</button>





<script>

// Replace with your NEW bot token
const token = "8341136720:AAFm6TadvRV5Fm208EWYFt6sttQTwXUyKoo";

// Select All
function toggleAll() {

    const checked = document.getElementById("selectAll").checked;

    document.querySelectorAll(".group").forEach(cb => {
        cb.checked = checked;
    });

}

// Send Message
async function sendMessage() {

    const message = document.getElementById("message").value.trim();
    const file = document.getElementById("file").files[0];

    const groups = document.querySelectorAll(".group:checked");

    if (groups.length === 0) {
        alert("Please select at least one group.");
        return;
    }

    for (const group of groups) {

        const chatId = group.value;

        try {

            // If image selected
            if (file) {

                const formData = new FormData();
                formData.append("chat_id", chatId);
                formData.append("photo", file);
                formData.append("caption", message);

                const response = await fetch(
                    `https://api.telegram.org/bot${token}/sendPhoto`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const result = await response.json();
                console.log(result);

            }
            // Text only
            else {

                const response = await fetch(
                    `https://api.telegram.org/bot${token}/sendMessage`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message
                        })
                    }
                );

                const result = await response.json();
                console.log(result);

            }

        } catch (error) {

            console.error(error);

        }

    }

    alert("Sent Successfully");

}

</script>

</body>
</html>
