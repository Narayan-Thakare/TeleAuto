<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
    <title>Telegram Sender</title>
</head>
<body>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

html, body{
    height:100%;
}

body{
    background:linear-gradient(135deg,#2193b0,#6dd5ed);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:clamp(12px, 4vw, 30px);
}

.container{
    width:100%;
    max-width:700px;
    background:#fff;
    border-radius:18px;
    padding:clamp(16px, 4vw, 30px);
    box-shadow:0 15px 40px rgba(0,0,0,.25);
}

h2{
    text-align:center;
    color:#0088cc;
    margin-bottom:clamp(16px, 3vw, 25px);
    font-size:clamp(20px, 4vw + 4px, 28px);
    word-break:break-word;
}

textarea{
    width:100%;
    height:clamp(100px, 20vw, 140px);
    resize:vertical;
    min-height:80px;
    max-height:300px;
    padding:clamp(10px, 2.5vw, 15px);
    border-radius:10px;
    border:2px solid #ddd;
    font-size:clamp(13px, 2vw + 8px, 15px);
    font-family:inherit;
    transition:.3s;
}

textarea:focus{
    border-color:#0088cc;
    outline:none;
}

.file-box{
    margin-top:clamp(14px, 3vw, 20px);
}

.file-box label{
    font-size:clamp(14px, 1.8vw + 8px, 16px);
    display:inline-block;
}

input[type=file]{
    width:100%;
    padding:clamp(8px, 2vw, 10px);
    border:2px dashed #0088cc;
    border-radius:10px;
    background:#f7fbff;
    cursor:pointer;
    font-size:clamp(12px, 1.5vw + 8px, 14px);
    /* allow long filenames to wrap instead of overflowing */
    overflow-wrap:break-word;
}

.group-box{
    margin-top:clamp(16px, 3.5vw, 25px);
    border:1px solid #ddd;
    border-radius:10px;
    padding:clamp(10px, 2.5vw, 15px);
    max-height:min(250px, 40vh);
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
}

.group-box h3{
    color:#444;
    margin-bottom:clamp(10px, 2.5vw, 15px);
    font-size:clamp(15px, 1.8vw + 8px, 17px);
}

.group-item{
    display:flex;
    align-items:center;
    padding:clamp(8px, 2vw, 10px);
    border-radius:8px;
    transition:.3s;
}

.group-item:hover{
    background:#eef8ff;
}

.group-item input{
    flex-shrink:0;
    margin-right:12px;
    width:18px;
    height:18px;
    transform:scale(1.2);
}

.group-item label{
    font-size:clamp(13px, 1.6vw + 8px, 15px);
    word-break:break-word;
}

.select-all{
    background:#0088cc;
    color:white;
    padding:clamp(8px, 2vw, 10px);
    border-radius:8px;
    margin-bottom:15px;
    display:flex;
    align-items:center;
    font-size:clamp(13px, 1.6vw + 8px, 15px);
}

.select-all input{
    flex-shrink:0;
    margin-right:10px;
    width:18px;
    height:18px;
    transform:scale(1.2);
}

button{
    width:100%;
    margin-top:clamp(16px, 3.5vw, 25px);
    padding:clamp(12px, 2.5vw, 15px);
    border:none;
    border-radius:10px;
    background:#0088cc;
    color:white;
    font-size:clamp(15px, 2vw + 8px, 18px);
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#006fa5;
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(0,136,204,.4);
}

button:active{
    transform:translateY(0);
}

.footer{
    text-align:center;
    margin-top:15px;
    color:#888;
    font-size:clamp(11px, 1.2vw + 8px, 13px);
}

/* ===========================
   Extra breakpoints for edge cases
=========================== */

/* Short / landscape phones: avoid the group list eating the whole screen */
@media (max-height: 480px) and (orientation: landscape){
    body{
        align-items:flex-start;
        padding:12px;
    }
    .group-box{
        max-height:35vh;
    }
}

/* Very small devices */
@media (max-width: 360px){
    .container{
        border-radius:12px;
    }
}

/* Foldables / very narrow widths */
@media (max-width: 280px){
    .select-all label,
    .group-item label{
        font-size:12px;
    }
}

</style>

</head>
<body>

<div class="container">

<h2>📨 Telegram Message Sender</h2>

<textarea
id="message"
placeholder="Type your message here..."></textarea>

<div class="file-box">

<label><b>📎 Attach File (Optional)</b></label>

<br><br>

<input type="file"
id="file"
accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip">

</div>

<div class="group-box">

<h3>👥 Select Groups</h3>

<div class="select-all">
<input type="checkbox" id="selectAll" onchange="toggleAll()">
<label>Select Alll Groups</label>
</div>

<div class="group-item">
<input type="checkbox" class="group" value="-5551738015">
<label>🚀 Demo Group</label>
</div>

<div class="group-item">
<input type="checkbox" class="group" value="-5468420834">
<label>💻 Demo Group 2</label>
</div>

<div class="group-item">
<input type="checkbox" class="group" value="-5489433287">
<label>📚 Demo Group 3</label>
</div>

</div>

<button onclick="sendMessage()">
🚀 Send Message
</button>

<div class="footer">
Made with ❤️ for Telegram Automation
</div>

</div>

<script>

// Replace with your NEW bot token
const token = "8341136720:AAFm6TadvRV5Fm208EWYFt6sttQTwXUyKoo";

// Select All
function toggleAll() {

    const checked = document.getElementById("selectAll").checked;

    document.querySelectorAll(".group").forEach(cb => {
        cb.checked = checked;
    });

}

// Send Message
async function sendMessage() {

    const message = document.getElementById("message").value.trim();
    const file = document.getElementById("file").files[0];

    const groups = document.querySelectorAll(".group:checked");

    if (groups.length === 0) {
        alert("Please select at least one group.");
        return;
    }

    if (message === "" && !file) {
        alert("Please enter a message or select a file.");
        return;
    }

    for (const group of groups) {

        const chatId = group.value;

        try {

            // If a file is selected
            if (file) {

                let apiMethod = "";
                let fileField = "";

                if (file.type.startsWith("image/")) {
                    apiMethod = "sendPhoto";
                    fileField = "photo";
                }
                else if (file.type.startsWith("video/")) {
                    apiMethod = "sendVideo";
                    fileField = "video";
                }
                else if (file.type.startsWith("audio/")) {
                    apiMethod = "sendAudio";
                    fileField = "audio";
                }
                else {
                    apiMethod = "sendDocument";
                    fileField = "document";
                }

                const formData = new FormData();
                formData.append("chat_id", chatId);
                formData.append(fileField, file);

                if (message !== "") {
                    formData.append("caption", message);
                }

                const response = await fetch(
                    `https://api.telegram.org/bot${token}/${apiMethod}`,
                    {
                        method: "POST",
                        body: formData
                    }
                );

                const result = await response.json();
                console.log(result);

                if (!result.ok) {
                    alert(result.description);
                }

            }
            // Text only
            else {

                const response = await fetch(
                    `https://api.telegram.org/bot${token}/sendMessage`,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: chatId,
                            text: message
                        })
                    }
                );

                const result = await response.json();
                console.log(result);

                if (!result.ok) {
                    alert(result.description);
                }
            }

        } catch (error) {
            console.error(error);
            alert("Failed to send message to " + chatId);
        }
    }

    alert("Sent Successfully!");

    // Clear form
    document.getElementById("message").value = "";
    document.getElementById("file").value = "";
}
</script>

</body>
</html>
